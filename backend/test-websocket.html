<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Test Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0f1419;
            color: #e7e9ea;
        }
        h1 { color: #1d9bf0; }
        .section {
            background: #16181c;
            border: 1px solid #2f3336;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border-radius: 6px;
            border: 1px solid #2f3336;
            background: #16181c;
            color: #e7e9ea;
        }
        button {
            background: #1d9bf0;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover { background: #1a8cd8; }
        button:disabled {
            background: #2f3336;
            cursor: not-allowed;
        }
        .status {
            padding: 8px 12px;
            border-radius: 4px;
            display: inline-block;
            margin: 5px 0;
            font-weight: 600;
        }
        .status.connected { background: #00ba7c; color: white; }
        .status.disconnected { background: #f4212e; color: white; }
        #messages {
            background: #000;
            padding: 15px;
            border-radius: 6px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        .message {
            padding: 4px 0;
            border-bottom: 1px solid #2f3336;
        }
        .message.sent { color: #1d9bf0; }
        .message.received { color: #00ba7c; }
        .message.error { color: #f4212e; }
        .message .time { color: #71767b; font-size: 11px; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket Test Client</h1>
    
    <div class="section">
        <h3>Connection</h3>
        <div>
            <span class="status disconnected" id="status">Disconnected</span>
        </div>
        <input type="text" id="token" placeholder="Clerk Token" style="width: 500px">
        <br>
        <button onclick="connect()" id="connectBtn">Connect</button>
        <button onclick="disconnect()" id="disconnectBtn" disabled>Disconnect</button>
    </div>

    <div class="section">
        <h3>Messages</h3>
        <div id="messages"></div>
    </div>

    <div class="section">
        <h3>Send Test Event</h3>
        <button onclick="sendPing()">Send Ping</button>
        <button onclick="simulateMessage()">Simulate Message</button>
    </div>

    <script>
        let ws = null;

        function log(message, type = 'received') {
            const messagesDiv = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString();
            messageEl.innerHTML = `<span class="time">[${time}]</span> ${message}`;
            
            messagesDiv.appendChild(messageEl);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function updateStatus(connected) {
            const statusEl = document.getElementById('status');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            if (connected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
            } else {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
            }
        }

        function connect() {
            const token = document.getElementById('token').value;
            if (!token) {
                log('Please enter a Clerk token', 'error');
                return;
            }

            const wsUrl = `ws://localhost:3001/ws?token=${encodeURIComponent(token)}`;
            log(`Connecting to ${wsUrl}...`, 'sent');

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                log('✅ Connected to WebSocket server', 'received');
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(`📨 Received: ${JSON.stringify(data, null, 2)}`, 'received');
                } catch (e) {
                    log(`📨 Received: ${event.data}`, 'received');
                }
            };

            ws.onerror = (error) => {
                log(`❌ WebSocket error: ${error}`, 'error');
            };

            ws.onclose = () => {
                log('Disconnected from server', 'error');
                updateStatus(false);
                ws = null;
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                log('Disconnecting...', 'sent');
            }
        }

        function sendPing() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected', 'error');
                return;
            }

            const message = { type: 'ping', timestamp: new Date().toISOString() };
            ws.send(JSON.stringify(message));
            log(`📤 Sent: ${JSON.stringify(message)}`, 'sent');
        }

        function simulateMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected', 'error');
                return;
            }

            const message = {
                type: 'message:new',
                data: {
                    messageId: 'test-' + Date.now(),
                    senderId: 1,
                    senderName: 'Test User',
                    text: 'Hello from WebSocket test!',
                    createdAt: new Date().toISOString()
                }
            };
            
            log(`📤 Would broadcast: ${JSON.stringify(message, null, 2)}`, 'sent');
            log('ℹ️ Note: Broadcasting is done server-side via API calls', 'received');
        }
    </script>
</body>
</html>
