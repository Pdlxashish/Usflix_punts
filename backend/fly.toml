# Fly.io configuration for Memory Flix Backend

app = "usflix-backend"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3001"
  NODE_ENV = "production"
  UPLOAD_DIR = "/app/uploads"
  MAX_FILE_SIZE = "4294967296"
  DISABLE_RATE_LIMIT = "false"

[mounts]
  source = "usflix_uploads"
  destination = "/app/uploads"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
